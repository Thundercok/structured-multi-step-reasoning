name: Research and Rep Watch Bot CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install headless research dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Check research protocol and controller
        run: python -m pytest tests/test_research_study.py test_optimal_stopping.py test_entry_predictor.py -q

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e rep_watch_bot/[dev]

      - name: Run Ruff Linter
        run: |
          ruff check rep_watch_bot/

      - name: Run Pytest Test Suite
        run: |
          pytest rep_watch_bot/tests
