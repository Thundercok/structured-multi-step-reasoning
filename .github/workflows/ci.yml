name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest sympy
      - name: Run research and boundary tests
        run: |
          python -m pytest \
            tests/test_repo_boundaries.py \
            tests/test_analyze.py \
            tests/test_counterfactual.py \
            tests/test_math_check.py \
            tests/test_math_data.py \
            tests/test_structured_trace.py \
            -q

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest certifi httpx
      - name: Run Ubuntu-compatible RAT tests
        run: |
          python -m pytest \
            tests/test_accessibility_permissions.py \
            tests/test_adaptive_reranker.py \
            tests/test_app_catalog_cache.py \
            tests/test_architecture_anti_overengineering.py \
            tests/test_artifact_store_lifecycle.py \
            tests/test_contradiction_auditor.py \
            tests/test_curriculum_mapper.py \
            tests/test_document_model_startup.py \
            tests/test_document_search_names.py \
            tests/test_feedback_features.py \
            tests/test_feedback_log.py \
            tests/test_fts_phrases.py \
            tests/test_goal_routing.py \
            tests/test_natal_places.py \
            tests/test_pdf_reading_presentation.py \
            tests/test_pdf_text.py \
            tests/test_query_cache.py \
            tests/test_query_compounds.py \
            tests/test_rat_chat_session.py \
            tests/test_report_and_edges.py \
            tests/test_reranker_golden.py \
            tests/test_semester_ranking.py \
            tests/test_slm_chat.py \
            tests/test_translation_glossary.py \
            tests/test_universal_timetable.py \
            tests/test_vgc_cascade.py \
            -q
