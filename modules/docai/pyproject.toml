[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nesy-docai-prototype"
version = "1.1.0"
description = "Standalone invoice inspection prototype; integration into RAT is deferred"
requires-python = ">=3.10"
dependencies = ["nesy-document-intake[vision]>=0.1.0", "z3-solver>=4.12.0", "pypdf>=4.0.0", "openpyxl>=3.1.0", "Pillow>=10.0.0", "requests>=2.31.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nesy_docai*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
